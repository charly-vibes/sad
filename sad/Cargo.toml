[package]
name = "sad"
version = "0.1.0"
edition = "2024"
description = "Documentation gate — code should speak for itself; prose means refactor"
license = "Apache-2.0"
repository = "https://github.com/charly-vibes/sad"
readme = "README.md"
keywords = ["cli", "documentation", "code-quality", "gates", "charly-vibes"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "sad"
path = "src/main.rs"

[dependencies]
# Suite envelope output — genesis is the shared charly-vibes infrastructure
# crate. Registry dep (NOT git): cargo publish requires all deps to resolve
# on crates.io.
genesis = { package = "genesis-vibes", version = "0.13" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `sad.toml` parsing — the config is TOML, not a bespoke mini-language.
toml = "0.8"
# User-configured marker ids are validated as regular expressions.
regex = "1"
# Pinned grammar frontends; pretender's known-good versions.
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "fat"
strip = "symbols"
codegen-units = 1
