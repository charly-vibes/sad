name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'book.toml'
      - 'theme/**'
      - 'Cargo.toml'
      - 'sad/Cargo.toml'
      - 'openspec/specs/**'
      - 'llms.txt'
      - 'llm.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      - name: Copy OpenSpec specs into docs source
        run: |
          mkdir -p docs/src/specs
          for dir in openspec/specs/*/; do
            name=$(basename "$dir")
            cp "$dir/spec.md" "docs/src/specs/$name.md"
          done

      - name: Generate release-status page from Cargo.toml
        # §6 (DDL-j0u): the book's version claims must come from Cargo.toml,
        # never from hand-typed text — hand-typed versions drift.
        run: |
          # root Cargo.toml is a workspace manifest — the crate version lives
          # in the member manifest
          VERSION=$(grep -m1 '^version' sad/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          TAG="${GITHUB_REF_NAME:-main}"
          mkdir -p docs/src
          cat > docs/src/release.md <<EOF
          # Release Status

          > **Generated artifact** (docs.yml, from Cargo.toml + git ref).
          > Do not hand-edit — the repo source files remain authoritative.

          - **Version:** v${VERSION}
          - **Built from:** ${TAG} @ ${GITHUB_SHA::7}
          EOF

      - name: Build book
        run: mdbook build

      - name: Copy LLM summaries to site root
        run: cp llms.txt llm.txt book/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # DDL-43g: smoke the live Pages URL — a 404'd book must fail this
      # repo's deploy immediately, not wait for the next hub conformance run.
      - name: Smoke live Pages URL
        run: curl -fsS --max-time 10 --retry 2 https://charly-vibes.github.io/sad/ >/dev/null