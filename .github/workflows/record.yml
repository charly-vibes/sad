# Record workflow — capture a scheduled snapshot on main
#
# Runs nightly (and on demand) on main only: observe the wai artifact tree and
# recent commits, rebuild the research record, and commit the snapshot
# deliberately. Capture never runs in a hook or on a pull request; the pre-push
# hook only verifies (`kaya check`).
#
# Deliberately NOT triggered on push: a capture derived from push N collides
# with local commits landing while the run executes (the kaya repo hit this
# live at v0.3.0 — conflicting ledger snapshots). The push below therefore
# rebases against origin/main in a retry loop; a bare cron git push is never
# acceptable.

name: Record

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: record
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    name: Capture record snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install kaya (pinned)
        run: cargo install --locked kaya@0.4.1

      - name: Configure git
        run: |
          git config user.name "sad record"
          git config user.email "record@sad.invalid"

      - name: Capture the record
        run: just record-capture

      - name: Commit and push the snapshot
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "record is current; nothing to commit"
            exit 0
          fi
          git commit -m "chore(record): capture scheduled snapshot"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            if [ -d .git/rebase-merge ]; then
              echo "snapshot push abandoned: rebase conflict — resolve manually" >&2
              exit 1
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "snapshot push failed after 5 attempts" >&2
          exit 1
