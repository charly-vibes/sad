# CI workflow - runs the same commands as local development
#
# Uses `just ci` to ensure parity between local and CI environments.
# If CI fails, run `just ci` locally to reproduce the issue.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned to a minor-version branch so a clippy float cannot re-break CI
      # while local runs an older toolchain. Bump this ref together with the
      # local toolchain (`rustup update`) to restore parity.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install ecosystem tools (§4 dogfood matrix, pinned)
        run: |
          cargo install --locked wai-cli@2026.10.19 dulce-de-leche@0.9.0 pretender@0.11.0 espectacular@0.12.3 testaruda@0.5.9 typos-cli@1.50.3
          npm install -g @fission-ai/openspec@2.0.0
      - name: Install bd (beads, pinned §4)
        run: |
          tmp=$(mktemp -d)
          curl -fsSL https://github.com/gastownhall/beads/releases/download/v1.3.0/beads_1.3.0_linux_amd64.tar.gz -o "$tmp/bd.tgz"
          # extract only the binary — the tarball also ships README/LICENSE/CHANGELOG
          # which must not clobber the repo checkout
          tar -xzf "$tmp/bd.tgz" -C "$tmp" bd
          sudo mv "$tmp/bd" /usr/local/bin/bd
      # §4 dogfood: installed tools must run, not just install
      - name: Smoke dogfooded tools
        env:
          DO_NOT_TRACK: "1"
        run: |
          bd --version >/dev/null
          ddl status >/dev/null
          wai status >/dev/null
          pretender --version >/dev/null
          ah --version >/dev/null
          openspec --version >/dev/null
          testaruda --version >/dev/null
          typos --version >/dev/null
      # DDL-43g: smoke our own live Pages URL — a 404'd book must fail this
      # repo's CI immediately, not wait for the next hub conformance run.
      - name: Smoke live Pages URL
        run: curl -fsS --max-time 10 --retry 2 https://charly-vibes.github.io/sad/ >/dev/null

      - name: Run CI pipeline
        run: just ci

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sad-linux-amd64
          path: target/release/sad
