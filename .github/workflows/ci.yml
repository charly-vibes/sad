# CI workflow - runs the same commands as local development
#
# Uses `just ci` to ensure parity between local and CI environments.
# If CI fails, run `just ci` locally to reproduce the issue.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned to a minor-version branch so a clippy float cannot re-break CI
      # while local runs an older toolchain. Bump this ref together with the
      # local toolchain (`rustup update`) to restore parity.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run CI pipeline
        run: just ci

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sad-linux-amd64
          path: target/release/sad
