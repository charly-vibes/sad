pre-commit:
  parallel: true
  commands:
# sad:managed:start
    sad-check:
      run: sad check
# sad:managed:end
    # ddl:managed:start (pre-commit)
    ddl-ah-check:
      run: ah check
    ddl-pretender-gate:
      run: pretender check --mode gate
    # ddl:managed:end (pre-commit)
    type-check:
      run: just type-check
    lint:
      run: just lint

pre-push:
  parallel: true
  commands:
# sad:managed:start
    sad-check:
      run: sad check
# sad:managed:end
    # ddl:managed:start (pre-push)
    ddl-ah-check:
      run: ah check
    # ddl:managed:end (pre-push)
    fmt:
      run: just fmt-check
    lint:
      run: just lint
    typos:
      run: just typos
    test:
      # Run only affected tests via testaruda --safe (falls back to cargo test).
      # Exit 20 = "nothing affected, safe to skip" (TIA-CI-003) is tolerated;
      # every other non-zero exit still fails the stage.
      run: testaruda select --safe --base origin/main --head HEAD || test $? -eq 20
